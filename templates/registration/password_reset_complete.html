{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete - Rent&Stay{% endblock %}

{% block content %}
<section class="py-20 bg-gray-50 min-h-screen flex items-center">
    <div class="max-w-md mx-auto px-4 w-full">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <div class="text-center mb-8">
                <svg class="h-16 w-16 text-green-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <h2 class="text-3xl font-bold text-gray-900">Password Reset Complete!</h2>
                <p class="text-gray-600 mt-2">Your password has been successfully reset.</p>
            </div>

            <div class="mb-6">
                <p class="text-gray-700 text-center">
                    You can now sign in with your new password.
                </p>
            </div>

            <a href="{% url 'signin' %}" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition font-medium block text-center">
                Sign In Now
            </a>
        </div>
    </div>
</section>
{% endblock %}
